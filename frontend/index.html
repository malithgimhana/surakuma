<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        if (localStorage.getItem('surakuma.theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch {
        // Keep the default light theme when browser storage is unavailable.
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12213A" />
    <meta
      name="description"
      content="Surakuma — community care and humanitarian aid coordination."
    />
    <title>සුරැකුම · Community care</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
